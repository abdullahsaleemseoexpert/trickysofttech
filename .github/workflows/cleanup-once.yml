name: One-time cleanup - remove nested public_html

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove nested public_html folder via FTP
        run: |
          npm install basic-ftp
          node -e "
          const ftp = require('basic-ftp');
          async function main() {
            const client = new ftp.Client();
            client.ftp.verbose = true;
            try {
              await client.access({
                host: process.env.FTP_SERVER,
                user: process.env.FTP_USERNAME,
                password: process.env.FTP_PASSWORD,
                secure: false,
              });
              const list = await client.list('/');
              console.log('Root listing before cleanup:', JSON.stringify(list.map(i => i.name)));
              if (list.some(i => i.name === 'public_html')) {
                await client.removeDir('/public_html');
                console.log('Removed nested /public_html folder');
              } else {
                console.log('No nested public_html folder found - nothing to clean up');
              }
              const listAfter = await client.list('/');
              console.log('Root listing after cleanup:', JSON.stringify(listAfter.map(i => i.name)));
            } catch (err) {
              console.error('FAILED:', err.message);
              process.exit(1);
            }
            client.close();
          }
          main();
          "
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
